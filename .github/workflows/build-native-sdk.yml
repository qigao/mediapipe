name: MediaPipe Tasks native SDK

on:
  pull_request:
    paths:
      - '.github/workflows/build-native-sdk.yml'
      - 'sdk/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-native-sdk.yml'
      - 'sdk/**'
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
            bazel: bazel-7.7.0-linux-x86_64
            bazel_sha: fe7e799cbc9140f986b063e06800a3d4c790525075c877d00a7112669824acbf
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            bazel: bazel-7.7.0-linux-arm64
            bazel_sha: 8d404f7a266ead50be0918f913df1449a4880f5c8ef36c88d09d6204e67f114d
          - target: android
            arch: x64
            runner: ubuntu-24.04
            bazel: bazel-7.7.0-linux-x86_64
            bazel_sha: fe7e799cbc9140f986b063e06800a3d4c790525075c877d00a7112669824acbf
          - target: android
            arch: arm64
            runner: ubuntu-24.04
            bazel: bazel-7.7.0-linux-x86_64
            bazel_sha: fe7e799cbc9140f986b063e06800a3d4c790525075c877d00a7112669824acbf
          - target: macos
            arch: x64
            runner: macos-15-intel
            bazel: bazel-7.7.0-darwin-x86_64
            bazel_sha: 5b254d6c51081502938835969be160e62aeb8799e5b00b2d3acfa0465d6ae7c8
          - target: macos
            arch: arm64
            runner: macos-15
            bazel: bazel-7.7.0-darwin-arm64
            bazel_sha: 2533ddc8628a96d1da3c5e99f45442d30fec93ee724316fd9687c78e56a84049
          - target: windows
            arch: x64
            runner: windows-2025
            bazel: bazel-7.7.0-windows-x86_64.exe
            bazel_sha: 36f82b752d59948a9b839738d7c96f1bcca384154619b3cdb041cabdbf105ae1
          - target: windows
            arch: arm64
            runner: windows-11-arm
            bazel: bazel-7.7.0-windows-x86_64.exe
            bazel_sha: 36f82b752d59948a9b839738d7c96f1bcca384154619b3cdb041cabdbf105ae1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        id: mingw
        if: matrix.target == 'windows'
        with:
          target: ${{ matrix.arch }}
          build-type: toolchain-only
      - uses: actions/cache@v6.1.0
        with:
          path: |
            build-angle/downloads
            build-sdk/downloads
            build-sdk/repository-cache
            build-sdk/disk-cache
          key: mediapipe-sdk-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('sdk/**') }}
          restore-keys: mediapipe-sdk-${{ matrix.target }}-${{ matrix.arch }}-
      - name: Install EGL and OpenGL ES headers
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl-dev libgles-dev
      - name: Build Vulkan-only ANGLE
        if: matrix.target == 'windows'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MINGW_ROOT: ${{ steps.mingw.outputs.root }}
        run: |
          python -B sdk/build_angle.py --arch "$ARCH" --compiler "$MINGW_ROOT" \
            --clang 'C:/Program Files/LLVM'
      - name: Build the pinned MediaPipe SDK
        shell: bash
        env:
          CC: clang
          CXX: clang++
          MINGW_ROOT: ${{ steps.mingw.outputs.root }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          BAZEL_ASSET: ${{ matrix.bazel }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          bazel="$RUNNER_TEMP/$BAZEL_ASSET"
          curl -fsSL --retry 3 "https://releases.bazel.build/7.7.0/release/$BAZEL_ASSET" -o "$bazel"
          printf '%s  %s\n' "$BAZEL_SHA" "$bazel" | shasum -a 256 -c -
          chmod +x "$bazel"
          if [[ "$TARGET" == android ]]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          fi
          args=(--target "$TARGET" --arch "$ARCH" --bazel "$bazel")
          if [[ "$TARGET" == windows ]]; then
            args+=(--compiler "$MINGW_ROOT" --angle build-angle/package)
          fi
          python3 -B sdk/build.py "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mediapipe-native-${{ matrix.target }}-${{ matrix.arch }}
          path: build-sdk/mediapipe-tasks-*-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: mediapipe-native-*
          merge-multiple: true
          path: release
      - name: Publish checked SDK archives
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum mediapipe-tasks-*.tar.gz > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            mediapipe-tasks-*.tar.gz SHA256SUMS
