name: Build MediaPipe + opencv_lite — iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # ONNXRuntime mobile packages do not publish 1.18.1; 1.18.0 is the
  # matching mobile release available from CocoaPods/Maven.
  ORT_VERSION: "1.18.0"
  OPENCV_LITE_REF: "v4.13"
  HERMETIC_PYTHON_VERSION: "3.12"
  # iOS deployment target
  IOS_DEPLOYMENT_TARGET: "15.0"
  OPENCV_IOS_INSTALL: "/Users/runner/opencv_lite_ios"

jobs:
  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout MediaPipe
      # -----------------------------------------------------------------------
      - name: Checkout MediaPipe
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/mediapipe
          ref: master
          path: mediapipe
          submodules: recursive

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # -----------------------------------------------------------------------
      # 3. Install Homebrew dependencies
      # -----------------------------------------------------------------------
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja bazelisk git wget python3

      # -----------------------------------------------------------------------
      # 4. Cache Bazel artifacts
      # -----------------------------------------------------------------------
      - name: Cache Bazel artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-ios-${{ hashFiles('mediapipe/WORKSPACE') }}
          restore-keys: bazel-ios-

      # -----------------------------------------------------------------------
      # 5. Download ONNXRuntime for iOS (XCFramework)
      # -----------------------------------------------------------------------
      - name: Download ONNXRuntime (iOS XCFramework)
        run: |
          set -euxo pipefail
          ORT_URL="https://download.onnxruntime.ai/pod-archive-onnxruntime-c-${ORT_VERSION}.zip"
          echo "Downloading ONNXRuntime iOS XCFramework v${ORT_VERSION}"
          curl -fL "${ORT_URL}" -o /tmp/ort_ios.zip
          mkdir -p /Users/runner/onnxruntime_ios
          unzip -q /tmp/ort_ios.zip -d /Users/runner/onnxruntime_ios

          mkdir -p /Users/runner/onnxruntime_ios_sdk/device/include/onnxruntime
          mkdir -p /Users/runner/onnxruntime_ios_sdk/device/lib
          mkdir -p /Users/runner/onnxruntime_ios_sdk/simulator/include/onnxruntime
          mkdir -p /Users/runner/onnxruntime_ios_sdk/simulator/lib

          cp -R /Users/runner/onnxruntime_ios/Headers/. \
            /Users/runner/onnxruntime_ios_sdk/device/include/
          cp -R /Users/runner/onnxruntime_ios/Headers/. \
            /Users/runner/onnxruntime_ios_sdk/device/include/onnxruntime/
          cp -R /Users/runner/onnxruntime_ios/Headers/. \
            /Users/runner/onnxruntime_ios_sdk/simulator/include/
          cp -R /Users/runner/onnxruntime_ios/Headers/. \
            /Users/runner/onnxruntime_ios_sdk/simulator/include/onnxruntime/
          cp /Users/runner/onnxruntime_ios/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime \
            /Users/runner/onnxruntime_ios_sdk/device/lib/libonnxruntime.a
          cp /Users/runner/onnxruntime_ios/onnxruntime.xcframework/ios-arm64_x86_64-simulator/onnxruntime.framework/onnxruntime \
            /Users/runner/onnxruntime_ios_sdk/simulator/lib/libonnxruntime.a

          echo "ORT_IOS_DEVICE_SDK=/Users/runner/onnxruntime_ios_sdk/device" >> $GITHUB_ENV
          echo "ORT_IOS_SIMULATOR_SDK=/Users/runner/onnxruntime_ios_sdk/simulator" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 6. Cache opencv_lite (iOS)
      # -----------------------------------------------------------------------
      - name: Cache opencv_lite (iOS)
        id: cache-opencv-lite-ios
        uses: actions/cache@v4
        with:
          path: /Users/runner/opencv_lite_ios
          key: opencv-lite-ios-${{ env.OPENCV_LITE_REF }}-ort${{ env.ORT_VERSION }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}-v1

      # -----------------------------------------------------------------------
      # 7. Clone and cross-compile opencv_lite as iOS XCFramework
      # -----------------------------------------------------------------------
      - name: Clone opencv_lite
        if: steps.cache-opencv-lite-ios.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${OPENCV_LITE_REF}" https://github.com/zihaomu/opencv_lite.git /tmp/opencv_lite

      - name: Build opencv_lite for iOS arm64 (device)
        if: steps.cache-opencv-lite-ios.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"
          cmake \
            -S /tmp/opencv_lite \
            -B /tmp/opencv_lite_ios_arm64 \
            -G Xcode \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/opencv_lite/platforms/ios/cmake/Toolchains/Toolchain-iPhoneOS_Xcode.cmake \
            -DIOS_ARCH=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_ARCHS=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
            -DIPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DCMAKE_INSTALL_PREFIX="/Users/runner/opencv_lite_ios/arm64" \
            -DORT_SDK="${ORT_IOS_DEVICE_SDK}" \
            -DONNXRT_ROOT_DIR="${ORT_IOS_DEVICE_SDK}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc,dnn,video \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_opencv_java=OFF \
            -DBUILD_FAT_JAVA_LIB=OFF \
            -DBUILD_opencv_highgui=OFF
          cmake --build /tmp/opencv_lite_ios_arm64 --config Release --parallel $(sysctl -n hw.logicalcpu) -- ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cmake --install /tmp/opencv_lite_ios_arm64 --config Release

      - name: Build opencv_lite for iOS Simulator (arm64 + x86_64)
        if: steps.cache-opencv-lite-ios.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"
          for SIM_ARCH in arm64 x86_64; do
            cmake \
              -S /tmp/opencv_lite \
              -B "/tmp/opencv_lite_sim_${SIM_ARCH}" \
              -G Xcode \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_TOOLCHAIN_FILE=/tmp/opencv_lite/platforms/ios/cmake/Toolchains/Toolchain-iPhoneSimulator_Xcode.cmake \
              -DIOS_ARCH="${SIM_ARCH}" \
              -DCMAKE_OSX_ARCHITECTURES="${SIM_ARCH}" \
              -DCMAKE_XCODE_ATTRIBUTE_ARCHS="${SIM_ARCH}" \
              -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
              -DIPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
              -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
              -DCMAKE_CONFIGURATION_TYPES=Release \
              -DCMAKE_INSTALL_PREFIX="/Users/runner/opencv_lite_ios/sim_${SIM_ARCH}" \
              -DORT_SDK="${ORT_IOS_SIMULATOR_SDK}" \
              -DONNXRT_ROOT_DIR="${ORT_IOS_SIMULATOR_SDK}" \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_LIST=core,imgproc,dnn,video \
              -DBUILD_TESTS=OFF \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_JAVA=OFF \
              -DBUILD_opencv_java=OFF \
              -DBUILD_FAT_JAVA_LIB=OFF \
              -DBUILD_opencv_highgui=OFF
            cmake --build "/tmp/opencv_lite_sim_${SIM_ARCH}" --config Release --parallel $(sysctl -n hw.logicalcpu) -- ARCHS="${SIM_ARCH}" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            cmake --install "/tmp/opencv_lite_sim_${SIM_ARCH}" --config Release
          done

      - name: Create fat simulator slice (lipo) and XCFramework
        if: steps.cache-opencv-lite-ios.outputs.cache-hit != 'true'
        run: |
          # Find all .a libraries from device build
          DEVICE_LIBS=$(find /Users/runner/opencv_lite_ios/arm64/lib -name "libopencv_*.a" | sort)
          echo "Device libs: ${DEVICE_LIBS}"

          mkdir -p /Users/runner/opencv_lite_ios/xcframework_inputs/device/lib
          mkdir -p /Users/runner/opencv_lite_ios/xcframework_inputs/simulator/lib

          # Copy device libs as-is
          cp -r /Users/runner/opencv_lite_ios/arm64/lib/libopencv_*.a \
            /Users/runner/opencv_lite_ios/xcframework_inputs/device/lib/

          # Lipo sim arm64 + x86_64 into fat simulator libs
          for LIB in $(ls /Users/runner/opencv_lite_ios/sim_arm64/lib/libopencv_*.a); do
            LIBNAME=$(basename ${LIB})
            SIM_X86="/Users/runner/opencv_lite_ios/sim_x86_64/lib/${LIBNAME}"
            if [ -f "${SIM_X86}" ]; then
              lipo -create "${LIB}" "${SIM_X86}" \
                -output "/Users/runner/opencv_lite_ios/xcframework_inputs/simulator/lib/${LIBNAME}"
            else
              cp "${LIB}" "/Users/runner/opencv_lite_ios/xcframework_inputs/simulator/lib/${LIBNAME}"
            fi
          done

          # Copy headers (same across architectures)
          cp -r /Users/runner/opencv_lite_ios/arm64/include \
            /Users/runner/opencv_lite_ios/xcframework_inputs/device/include
          cp -r /Users/runner/opencv_lite_ios/arm64/include \
            /Users/runner/opencv_lite_ios/xcframework_inputs/simulator/include

          echo "XCFramework inputs prepared."
          ls /Users/runner/opencv_lite_ios/xcframework_inputs/device/lib/
          ls /Users/runner/opencv_lite_ios/xcframework_inputs/simulator/lib/

      # -----------------------------------------------------------------------
      # 8. Patch MediaPipe WORKSPACE for iOS opencv_lite
      # -----------------------------------------------------------------------
      - name: Patch WORKSPACE (iOS)
        working-directory: mediapipe
        run: |
          python3 - <<'EOF'
          import re, pathlib

          ws = pathlib.Path("WORKSPACE")
          content = ws.read_text()

          # MediaPipe uses opencv_ios_source.BUILD with a local xcframework
          # Point ios_opencv to our opencv_lite install
          pattern = r'(new_local_repository\s*\(\s*name\s*=\s*"ios_opencv"[^)]*path\s*=\s*")[^"]*(")'
          replacement = r'\g<1>/Users/runner/opencv_lite_ios/xcframework_inputs\g<2>'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          new_content = new_content.replace(
              'default_python_version = "system"',
              'default_python_version = "3.12"',
          )
          if new_content == content:
              print("WARNING: ios_opencv path and hermetic Python defaults were not changed — check manually")
          else:
              ws.write_text(new_content)
              print("Patched ios_opencv path and hermetic Python version")
          EOF

      - name: Generate opencv_ios_source.BUILD
        working-directory: mediapipe
        run: |
          python3 - <<'EOF'
          import pathlib, glob, textwrap

          device_libs = sorted(glob.glob("/Users/runner/opencv_lite_ios/xcframework_inputs/device/lib/libopencv_*.a"))
          lib_entries_device = "\n".join(f'        "device/lib/{pathlib.Path(l).name}",' for l in device_libs)
          lib_entries_sim    = "\n".join(
              f'        "simulator/lib/{pathlib.Path(l).name}",' for l in device_libs
          )

          content = f"""# Auto-generated by build-mediapipe-opencv-lite-ios.yml
          # opencv_lite static libs for iOS device + simulator
          cc_library(
              name = "opencv",
              hdrs = glob([
                  "device/include/opencv2/**/*.h",
                  "device/include/opencv2/**/*.hpp",
              ]),
              includes = ["device/include"],
              srcs = select({{
                  "@platforms//cpu:aarch64": [
          {lib_entries_device}
                  ],
                  "//conditions:default": [
          {lib_entries_sim}
                  ],
              }}),
              visibility = ["//visibility:public"],
              linkstatic = 1,
          )
          """
          content = textwrap.dedent(content)
          out = pathlib.Path("third_party/opencv_ios_source.BUILD")
          out.write_text(content)
          print("Written", out)
          print(content)
          EOF

      # -----------------------------------------------------------------------
      # 9. Build MediaPipe iOS framework
      # -----------------------------------------------------------------------
      - name: Build MediaPipe iOS Framework
        working-directory: mediapipe
        run: |
          bazel build \
            -c opt \
            --config=ios \
            --cpu=ios_arm64 \
            --apple_platform_type=ios \
            --ios_minimum_os="${IOS_DEPLOYMENT_TARGET}" \
            --repo_env=HERMETIC_PYTHON_VERSION="${HERMETIC_PYTHON_VERSION}" \
            --define MEDIAPIPE_DISABLE_GPU=0 \
            //mediapipe/objc:mediapipe_framework_ios

      # -----------------------------------------------------------------------
      # 10. Upload iOS artifact
      # -----------------------------------------------------------------------
      - name: Upload iOS Framework artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-ios-framework
          path: mediapipe/bazel-bin/mediapipe/objc/MediaPipeFramework.zip
          retention-days: 7
