name: MediaPipe Tasks MSVC SDK

on:
  pull_request:
    paths:
      - '.github/workflows/build-msvc-sdk.yml'
      - 'sdk/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-msvc-sdk.yml'
      - 'sdk/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediapipe-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencv:
    name: OpenCVLite MSVC ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    uses: qigao/ocv/.github/workflows/build-opencv.yml@c958734a5b481a5906dc12a4fd5df68c2339da69
    with:
      profile: static
      platform: windows-${{ matrix.arch }}-msvc
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      ocv_ref: c958734a5b481a5906dc12a4fd5df68c2339da69

  build:
    name: MediaPipe MSVC ${{ matrix.arch }}
    needs: opencv
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: opencv-static-windows-${{ matrix.arch }}-msvc
          path: opencv-sdk
      - uses: actions/cache@v6.1.0
        with:
          path: |
            build-sdk/downloads
            build-sdk/repository-cache
            build-sdk/disk-cache
          key: mediapipe-sdk-windows-${{ matrix.arch }}-msvc-${{ hashFiles('sdk/**', '.github/workflows/build-msvc-sdk.yml') }}
          restore-keys: mediapipe-sdk-windows-${{ matrix.arch }}-msvc-
      - name: Select Visual Studio Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "BAZEL_VC=$(Join-Path $vs 'VC')" >> $env:GITHUB_ENV
      - name: Build the pinned MediaPipe SDK
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          BAZEL_ASSET: bazel-7.7.0-windows-x86_64.exe
          BAZEL_SHA: 36f82b752d59948a9b839738d7c96f1bcca384154619b3cdb041cabdbf105ae1
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "sdk")
          from build import fetch

          asset = os.environ["BAZEL_ASSET"]
          fetch(Path(os.environ["RUNNER_TEMP"]),
                f"https://releases.bazel.build/7.7.0/release/{asset}",
                os.environ["BAZEL_SHA"])
          PY
          python -B sdk/build.py --target windows --arch "$ARCH" --windows-toolchain msvc \
            --bazel "$RUNNER_TEMP/$BAZEL_ASSET" \
            --opencv-archive "opencv-sdk/opencv-4.11.0-static-windows-$ARCH-msvc.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mediapipe-native-windows-${{ matrix.arch }}-msvc
          path: build-sdk/mediapipe-tasks-*-windows-${{ matrix.arch }}-msvc.tar.gz
          if-no-files-found: error
