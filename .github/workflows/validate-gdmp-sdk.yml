name: Validate macOS CoreVideo upload inside MediaPipe

on:
  push:
    branches: [ci/gdmp-sdk-43123166519]

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            arch: arm64
            runner: macos-15
            osx_arch: arm64
            godot_asset: Godot_v4.5.2-stable_macos.universal.zip
            godot_sha: 2a3f35cf5813b0d26e3f4c15dabc5e7c58407fceec7bae5291740772f72d141a
            godot_bin: Godot.app/Contents/MacOS/Godot
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: qigao/godot-plugins
          ref: 9a6e5f10835178732107e01f6aa15e4c62064ec8
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: qigao/mediapipe
          run-id: 43123166519
          name: mediapipe-native-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/gdmp
      - uses: actions/checkout@v7.0.1
        with:
          path: .sdk-validation
          persist-credentials: false
      - name: Build the GDMP extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OSX_ARCH: ${{ matrix.osx_arch }}
        run: |
          inputs="$RUNNER_TEMP/gdmp"
          mkdir -p "$inputs"/{bindings,mediapipe}
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            if [[ "$TARGET" == windows ]]; then
              printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
            else
              printf '%s  %s\n' "$sha" "$file" | shasum -a 256 -c -
            fi
          }

          sdk="mediapipe-tasks-1.2.2-$TARGET-$ARCH.tar.gz"
          bindings=e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            d4c03daf46c8bef4544614182b0762c3e32789151c7f8f44e8eb2053d5cddeba "$inputs/godot-cpp.tar.gz"
          (
            cd "$inputs"
            tar -xzf "$sdk" -C mediapipe
            tar -xzf godot-cpp.tar.gz --strip-components=1 -C bindings
          )

          source=mediapipe/calculators/image/image_clone_calculator.cc
          revision=2c2d4a7454d6358e0d6f0b54e254d231fe4cc78f
          mkdir -p "$inputs/patched/$(dirname "$source")"
          download "https://raw.githubusercontent.com/google-ai-edge/mediapipe/$revision/$source" \
            1105ce4b4a81c6c8a33f4b8442d8abb3b367c539b42b1cfb2cf64c223fb8fdb5 "$inputs/patched/$source"
          (
            cd "$inputs/patched"
            git apply --include="$source" "$GITHUB_WORKSPACE/.sdk-validation/sdk/patches/macos-corevideo-image-clone.diff"
          )
          python3 - "$inputs" "$source" <<'PY'
          from pathlib import Path
          import re
          import sys
          inputs, source = Path(sys.argv[1]), sys.argv[2]
          config = inputs / "mediapipe/lib/cmake/MediaPipe/MediaPipeConfig.cmake"
          text, count = re.subn(r'^  "\$<LINK_LIBRARY:WHOLE_ARCHIVE,[^>]+/libimage_clone_calculator\.(?:a|lo)>"\n',
                                '', config.read_text(), flags=re.MULTILINE)
          assert count == 1, count
          config.write_text(text)
          with Path("src/gdmp/CMakeLists.txt").open("a") as cmake:
              cmake.write(f'\ntarget_sources(gdmp PRIVATE "{inputs / "patched" / source}")\n')
          PY

          cmake -S src/gdmp -B build-gdmp-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DMediaPipe_DIR=$inputs/mediapipe/lib/cmake/MediaPipe" "-DGODOT_CPP_DIR=$inputs/bindings" \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 "-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCH"
          cmake --build build-gdmp-sdk --parallel 4
      - name: Run face, hand, and pose inference in Godot
        if: matrix.target != 'android'
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          inputs="$RUNNER_TEMP/gdmp"
          curl -fsSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$GODOT_ASSET" \
            -o "$inputs/godot.zip"
          if [[ $OSTYPE == darwin* ]]; then
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | sha256sum -c -
          fi
          mkdir "$inputs/engine"
          (cd "$inputs/engine" && cmake -E tar xf ../godot.zip)
          bash tests/mediapipe/run.sh build-gdmp-sdk "$inputs/engine/$GODOT_BIN"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gdmp-sdk-${{ matrix.target }}-${{ matrix.arch }}
          path: build-gdmp-sdk/addons/GDMP
          if-no-files-found: error
