name: GDMP validation with the native CI SDK

on:
  push:
    branches: [ci/gdmp-sdk-43123166519]

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            arch: arm64
            runner: macos-15
            osx_arch: arm64
            godot_asset: Godot_v4.5.2-stable_macos.universal.zip
            godot_sha: 2a3f35cf5813b0d26e3f4c15dabc5e7c58407fceec7bae5291740772f72d141a
            godot_bin: Godot.app/Contents/MacOS/Godot
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: qigao/godot-plugins
          ref: 9a1f89ad002dbc834daca1e003d4d82c503b5e5b
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: qigao/mediapipe
          run-id: 43123166519
          name: mediapipe-native-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/gdmp
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        id: mingw
        if: matrix.target == 'windows'
        with:
          target: ${{ matrix.arch }}
          build-type: toolchain-only
      - name: Install EGL and OpenGL ES libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri
      - name: Supply a CoreVideo-backed image to Metal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/gdmp/GDMP/util/image.cc")
          source = path.read_text()
          source = source.replace('#include "GDMP/util/image.h"', '#include "GDMP/util/image.h"\n\n#include "mediapipe/objc/util.h"')
          old = "return mediapipe::Image(get_image_frame(image));"
          new = """auto frame = get_image_frame(image);
          \tif (frame && frame->Format() == mediapipe::ImageFormat::SRGBA) {
          \t\tauto pixel_buffer = mediapipe::CreateCVPixelBufferForImageFrame(std::move(frame), false);
          \t\tERR_FAIL_COND_V_MSG(!pixel_buffer.ok(), mediapipe::Image(), pixel_buffer.status().ToString().c_str());
          \t\treturn mediapipe::Image(**pixel_buffer);
          \t}
          \treturn mediapipe::Image(std::move(frame));"""
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
      - name: Build the GDMP extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          ANDROID_ABI: ${{ matrix.android_abi }}
          OSX_ARCH: ${{ matrix.osx_arch }}
          MINGW_TOOLCHAIN: ${{ steps.mingw.outputs.toolchain-file }}
        run: |
          inputs="$RUNNER_TEMP/gdmp"
          mkdir -p "$inputs"/{bindings,mediapipe}
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            if [[ "$TARGET" == windows ]]; then
              printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
            else
              printf '%s  %s\n' "$sha" "$file" | shasum -a 256 -c -
            fi
          }

          sdk="mediapipe-tasks-1.2.2-$TARGET-$ARCH.tar.gz"
          bindings=e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            d4c03daf46c8bef4544614182b0762c3e32789151c7f8f44e8eb2053d5cddeba "$inputs/godot-cpp.tar.gz"
          (
            cd "$inputs"
            tar -xzf "$sdk" -C mediapipe
            tar -xzf godot-cpp.tar.gz --strip-components=1 -C bindings
          )

          args=()
          case "$TARGET" in
            linux) args+=(-DCMAKE_CXX_COMPILER=clang++) ;;
            macos) args+=(-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
                         "-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCH") ;;
            android) args+=("-DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake"
                           "-DANDROID_ABI=$ANDROID_ABI" -DANDROID_PLATFORM=android-26) ;;
            windows) args+=("-DCMAKE_TOOLCHAIN_FILE=$MINGW_TOOLCHAIN") ;;
          esac
          cmake -S src/gdmp -B build-gdmp-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DMediaPipe_DIR=$inputs/mediapipe/lib/cmake/MediaPipe" "-DGODOT_CPP_DIR=$inputs/bindings" "${args[@]}"
          cmake --build build-gdmp-sdk --parallel 4
      - name: Run face, hand, and pose inference in Godot
        if: matrix.target != 'android'
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          inputs="$RUNNER_TEMP/gdmp"
          curl -fsSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$GODOT_ASSET" \
            -o "$inputs/godot.zip"
          if [[ $OSTYPE == darwin* ]]; then
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | sha256sum -c -
          fi
          mkdir "$inputs/engine"
          (cd "$inputs/engine" && cmake -E tar xf ../godot.zip)
          bash tests/mediapipe/run.sh build-gdmp-sdk "$inputs/engine/$GODOT_BIN"
      - name: Check the Android library
        if: matrix.target == 'android'
        shell: bash
        env:
          GODOT_ARCH: ${{ matrix.godot_arch }}
        run: |
          python3 -B tests/mediapipe/check_android.py \
            "build-gdmp-sdk/addons/GDMP/libs/$GODOT_ARCH/libGDMP.android.so" \
            "$ANDROID_HOME/ndk/27.3.13750724" "$GODOT_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gdmp-sdk-${{ matrix.target }}-${{ matrix.arch }}
          path: build-gdmp-sdk/addons/GDMP
          if-no-files-found: error
