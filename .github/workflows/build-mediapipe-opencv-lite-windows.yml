name: Build MediaPipe + opencv_lite — Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ORT_VERSION: "1.18.1"
  OPENCV_LITE_REF: "v4.13"
  OPENCV_INSTALL_PREFIX: "C:/opencv_lite_install"

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout MediaPipe
      # -----------------------------------------------------------------------
      - name: Checkout MediaPipe
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/mediapipe
          ref: master
          path: mediapipe
          submodules: recursive

      # -----------------------------------------------------------------------
      # 2. Install MSVC / Visual Studio build tools (already on windows-2022)
      #    Install cmake, ninja via choco
      # -----------------------------------------------------------------------
      - name: Install build tools
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y
          choco install wget -y
        shell: powershell

      # -----------------------------------------------------------------------
      # 3. Set up Bazelisk
      # -----------------------------------------------------------------------
      - name: Set up Bazelisk
        run: |
          $url = "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "C:\bazel.exe"
          # Add to PATH for subsequent steps
          echo "C:\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          C:\bazel.exe version
        shell: powershell

      # -----------------------------------------------------------------------
      # 4. Cache Bazel artifacts
      # -----------------------------------------------------------------------
      - name: Cache Bazel artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-windows-${{ hashFiles('mediapipe/WORKSPACE') }}
          restore-keys: bazel-windows-

      # -----------------------------------------------------------------------
      # 5. Download ONNXRuntime for Windows
      # -----------------------------------------------------------------------
      - name: Download ONNXRuntime (Windows)
        run: |
          $archive = "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile "C:\$archive"
          Expand-Archive -Path "C:\$archive" -DestinationPath "C:\onnxruntime" -Force
          # Strip top-level directory in archive
          $inner = Get-ChildItem "C:\onnxruntime" | Select-Object -First 1
          Move-Item "$($inner.FullName)\*" "C:\onnxruntime\" -Force
          echo "ORT_SDK=C:\onnxruntime" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell

      # -----------------------------------------------------------------------
      # 6. Cache opencv_lite build
      # -----------------------------------------------------------------------
      - name: Cache opencv_lite (Windows)
        id: cache-opencv-lite-win
        uses: actions/cache@v4
        with:
          path: C:/opencv_lite_install
          key: opencv-lite-windows-${{ env.OPENCV_LITE_REF }}-ort${{ env.ORT_VERSION }}-v2

      # -----------------------------------------------------------------------
      # 7. Clone and build opencv_lite (Windows / MSVC)
      # -----------------------------------------------------------------------
      - name: Clone opencv_lite
        if: steps.cache-opencv-lite-win.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch %OPENCV_LITE_REF% https://github.com/zihaomu/opencv_lite.git C:\opencv_lite_src
        shell: cmd

      - name: Build opencv_lite (MSVC)
        if: steps.cache-opencv-lite-win.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          function Invoke-Checked {
            param([Parameter(Mandatory=$true)][scriptblock]$Command)
            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit code $LASTEXITCODE"
            }
          }

          New-Item -ItemType Directory -Force -Path "C:\opencv_lite_src\build"
          Invoke-Checked {
            cmake -S C:\opencv_lite_src -B C:\opencv_lite_src\build `
              -G "Visual Studio 17 2022" -A x64 `
              "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_INSTALL_PREFIX="$env:OPENCV_INSTALL_PREFIX" `
              -DORT_SDK="$env:ORT_SDK" `
              -DBUILD_SHARED_LIBS=ON `
              "-DBUILD_LIST=core,imgproc,imgcodecs,dnn,video,highgui" `
              -DBUILD_TESTS=OFF `
              -DBUILD_EXAMPLES=OFF `
              -DBUILD_JAVA=OFF `
              -DBUILD_opencv_java=OFF `
              -DBUILD_FAT_JAVA_LIB=OFF
          }
          Invoke-Checked {
            cmake --build C:\opencv_lite_src\build --config Release -j $env:NUMBER_OF_PROCESSORS
          }
          Invoke-Checked {
            cmake --install C:\opencv_lite_src\build --config Release
          }

      # -----------------------------------------------------------------------
      # 8. Patch WORKSPACE & opencv_windows.BUILD
      # -----------------------------------------------------------------------
      - name: Patch WORKSPACE (Windows path)
        working-directory: mediapipe
        shell: python
        run: |
          import re, pathlib

          ws = pathlib.Path("WORKSPACE")
          content = ws.read_text()
          # Replace windows_opencv path
          pattern = r'(new_local_repository\s*\(\s*name\s*=\s*"windows_opencv"[^)]*path\s*=\s*")[^"]*(")'
          replacement = r'\g<1>C:/opencv_lite_install\g<2>'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          if new_content == content:
              print("WARNING: windows_opencv path not found in WORKSPACE")
          else:
              ws.write_text(new_content)
              print("Patched windows_opencv path -> C:/opencv_lite_install")

      - name: Generate opencv_windows.BUILD
        working-directory: mediapipe
        shell: python
        run: |
          import pathlib, glob, os

          install = "C:/opencv_lite_install"
          libs = sorted(glob.glob(os.path.join(install, "x64/vc17/lib/opencv_*.lib")))
          if not libs:
              libs = sorted(glob.glob(os.path.join(install, "lib/opencv_*.lib")))
          if not libs:
              raise RuntimeError(f"No opencv_lite import libraries found under {install}")
          if not any("opencv_core" in os.path.basename(l) for l in libs):
              raise RuntimeError(f"opencv_core import library not found. Found: {libs}")

          print(f"Found libs: {libs}")
          lib_entries = "\n".join(
              f'        "{os.path.relpath(l, install).replace(chr(92), "/")},"' for l in libs
          )

          content = f"""# Auto-generated by build-mediapipe-opencv-lite-windows.yml
          cc_library(
              name = "opencv",
              hdrs = glob([
                  "include/opencv2/**/*.h",
                  "include/opencv2/**/*.hpp",
              ]),
              includes = ["include"],
              srcs = [
          {lib_entries}
              ],
              visibility = ["//visibility:public"],
          )
          """
          import textwrap
          content = textwrap.dedent(content)
          pathlib.Path("third_party/opencv_windows.BUILD").write_text(content)
          print("Written third_party/opencv_windows.BUILD")

      # -----------------------------------------------------------------------
      # 9. Build MediaPipe hello_world (Windows desktop)
      # -----------------------------------------------------------------------
      - name: Build MediaPipe (Windows)
        working-directory: mediapipe
        shell: powershell
        run: |
          $env:ORT_SDK = "C:\onnxruntime"
          bazel build -c opt --define MEDIAPIPE_DISABLE_GPU=1 --define protobuf_allow_msvc=true //mediapipe/examples/desktop/hello_world:hello_world

      # -----------------------------------------------------------------------
      # 10. Package: bundle opencv_lite DLLs + mediapipe into a distributable zip
      # -----------------------------------------------------------------------
      - name: Create distributable package (Windows)
        shell: powershell
        run: |
          $version = (Get-Date -Format 'yyyyMMdd') + '-' + $env:GITHUB_SHA.Substring(0, 7)
          $pkgName = "mediapipe-opencv_lite-windows-x64-$version"
          $pkgDir  = "C:\pkg\$pkgName"

          New-Item -ItemType Directory -Force -Path "$pkgDir\bin"
          New-Item -ItemType Directory -Force -Path "$pkgDir\lib"
          New-Item -ItemType Directory -Force -Path "$pkgDir\include"

          # --- opencv_lite DLLs ---
          Write-Host "Copying opencv_lite DLLs..."
          $dllDirs = @(
            "$env:OPENCV_INSTALL_PREFIX\x64\vc17\bin",
            "$env:OPENCV_INSTALL_PREFIX\bin"
          )
          foreach ($d in $dllDirs) {
            if (Test-Path $d) {
              Copy-Item "$d\opencv_*.dll" "$pkgDir\bin\" -ErrorAction SilentlyContinue
            }
          }

          # --- opencv_lite import libs ---
          $libDirs = @(
            "$env:OPENCV_INSTALL_PREFIX\x64\vc17\lib",
            "$env:OPENCV_INSTALL_PREFIX\lib"
          )
          foreach ($d in $libDirs) {
            if (Test-Path $d) {
              Copy-Item "$d\opencv_*.lib" "$pkgDir\lib\" -ErrorAction SilentlyContinue
            }
          }

          # --- ONNXRuntime DLL ---
          Copy-Item "C:\onnxruntime\lib\onnxruntime*.dll" "$pkgDir\bin\" -ErrorAction SilentlyContinue

          # --- opencv_lite headers ---
          Write-Host "Copying headers..."
          $includeSrc = "$env:OPENCV_INSTALL_PREFIX\include"
          if (Test-Path $includeSrc) {
            Copy-Item -Recurse "$includeSrc\opencv2" "$pkgDir\include\" -ErrorAction SilentlyContinue
          }

          # --- MediaPipe hello_world binary ---
          Write-Host "Copying MediaPipe binary..."
          Copy-Item `
            "mediapipe\bazel-bin\mediapipe\examples\desktop\hello_world\hello_world.exe" `
            "$pkgDir\bin\hello_world.exe" -ErrorAction SilentlyContinue

          # --- README ---
          $readmeContent = @"
          MediaPipe + opencv_lite -- Windows x64
          ======================================
          Built:    $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC'))
          Commit:   $env:GITHUB_SHA
          Ref:      $env:GITHUB_REF

          ONNXRuntime version: $env:ORT_VERSION

          Contents:
            bin\   -- MediaPipe binaries + opencv_lite DLLs + ONNX Runtime DLL
            lib\   -- opencv_lite import libraries (.lib)
            include\opencv2\ -- opencv_lite C++ headers

          Usage:
            Add bin\ to your PATH or place DLLs next to your executable.
          "@
          $readmeContent | Out-File -FilePath "$pkgDir\README.txt" -Encoding UTF8

          # --- Zip ---
          Compress-Archive -Path "C:\pkg\$pkgName" -DestinationPath "C:\pkg\$pkgName.zip"
          "PKG_NAME=$pkgName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package created: C:\pkg\$pkgName.zip"
          (Get-Item "C:\pkg\$pkgName.zip").Length / 1MB | ForEach-Object { Write-Host "Size: $([math]::Round($_, 2)) MB" }

      # -----------------------------------------------------------------------
      # 11. Upload the full Windows package as a GitHub artifact
      # -----------------------------------------------------------------------
      - name: Upload Windows package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: C:\pkg\${{ env.PKG_NAME }}.zip
          retention-days: 30
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 12. Create a GitHub Release on version tags (e.g. v1.2.3)
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:\pkg\${{ env.PKG_NAME }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
